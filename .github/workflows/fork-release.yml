name: fork-release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The toolchain matches Homebrew's gcc-arm-embedded cask (README), so the image
# fits the same code window as the maintainer's builds. clang-format is pinned to
# the version the repo's format test passes with.
env:
  ARM_TOOLCHAIN: 15.3.rel2
  ARM_TOOLCHAIN_SHA256: 463df9665c246fa13bab2102115bbf83440661b6eb70b44f3dfd4712ca30037a
  CLANG_FORMAT_VERSION: 23.1.5

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang libsdl2-dev
          python -m pip install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Cache the Arm toolchain
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/arm
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN }}-x86_64-${{ env.ARM_TOOLCHAIN_SHA256 }}
      - name: Download the Arm toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          name="arm-gnu-toolchain-${ARM_TOOLCHAIN}-x86_64-arm-none-eabi.tar.xz"
          base="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/${ARM_TOOLCHAIN}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$name" "$base/$name"
          echo "${ARM_TOOLCHAIN_SHA256}  $RUNNER_TEMP/$name" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/arm"
          tar -xJf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/arm" --strip-components=1
          rm "$RUNNER_TEMP/$name"
      - name: Put the Arm toolchain on the path
        run: |
          echo "$RUNNER_TEMP/arm/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/arm/bin/arm-none-eabi-gcc" --version | head -1
      - name: Set up the tools venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt
      # fonts_up_to_date and sort_fold_up_to_date also fail on a clean upstream
      # checkout outside the maintainer's machine (generated files depend on the
      # clang-format version), so they don't gate a release. Drop the exclusion
      # once they pass here. The build is strict C11, where glibc hides POSIX
      # calls the simulator uses (ftruncate, fileno); macOS doesn't, so
      # _DEFAULT_SOURCE gives Linux the same headers.
      - name: Build and test (dev preset)
        env:
          CC: clang
          CFLAGS: -D_DEFAULT_SOURCE
        run: |
          cmake --preset dev
          cmake --build --preset dev --parallel
          ctest --preset dev --parallel 4 -E '^(fonts_up_to_date|sort_fold_up_to_date)$'
      - name: Build the release image
        run: |
          cmake --preset release
          cmake --build --preset release --parallel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HIFIEC90.IMG
          path: build/release/HIFIEC90.IMG
          if-no-files-found: error

  echo-sync:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: echo-sync-windows-x64.exe
            built: dist/echo-sync.exe
          - os: macos-latest
            asset: echo-sync-macos-arm64
            built: dist/echo-sync
          - os: ubuntu-22.04
            asset: echo-sync-linux-x64
            built: dist/echo-sync
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the tools' packages
        run: python -m pip install -r tools/requirements.txt -r tools/requirements-build.txt
      - name: Test the tools
        run: python -m unittest discover -s tools/tests
      - name: Build one file
        run: >
          python -m PyInstaller --onefile --console --name echo-sync
          --paths tools --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller
          tools/echo_sync.py
      - name: Smoke test
        run: |
          ${{ matrix.built }} --help
          mkdir -p smoke/.echo smoke/Artist/Album
          python -c "import sys; sys.path[:0] = ['tools', 'tools/tests']; from pathlib import Path; from test_library_index import write_silent_flac; write_silent_flac(Path('smoke/Artist/Album/01 - Song.flac'), 1)"
          ${{ matrix.built }} smoke --dry-run
      - name: Name the file for its platform
        run: mv "${{ matrix.built }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [firmware, echo-sync]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release-files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^set(ECHO_FIRMWARE_VERSION "\([0-9.]*\)".*/\1/p' platform/device/CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "ECHO_FIRMWARE_VERSION not found in platform/device/CMakeLists.txt" >&2
            exit 1
          fi
          tag="v${version}-fork.${GITHUB_RUN_NUMBER}"
          (cd "$RUNNER_TEMP/release-files" && sha256sum -- * > SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/release-files/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP"/release-files/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "EchoPod ${version} (fork build ${GITHUB_RUN_NUMBER})" \
              --generate-notes
          fi
